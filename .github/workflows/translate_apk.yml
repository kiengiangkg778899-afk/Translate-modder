name: "Gia Long Studio - Premium APK Builder"

on:
  workflow_dispatch:

jobs:
  build_all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool default-jdk
          pip install deep-translator

      - name: Prepare Translation Script
        run: |
          cat << 'EOF' > translate_apk.py
          import os, re
          from deep_translator import GoogleTranslator
          translator = GoogleTranslator(source='auto', target='vi')
          chinese_pattern = re.compile(r'"([^"\n]*[\u4e00-\u9fa5]+[^"\n]*)"')
          def replace(match):
              text = match.group(1)
              try: return f'"{translator.translate(text)}"'
              except: return f'"{text}"'
          for root, _, files in os.walk('decompiled_app'):
              for file in files:
                  if file.endswith(('.smali', '.xml')):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                          if any('\u4e00' <= char <= '\u9fa5' for char in content):
                              new_content = chinese_pattern.sub(replace, content)
                              with open(path, 'w', encoding='utf-8') as f: f.write(new_content)
                          except: continue
          EOF

      - name: Decompile & Translate
        run: |
          if [ ! -f "original.apk" ]; then echo "LỖI: Chưa có file original.apk"; exit 1; fi
          apktool d -f original.apk -o decompiled_app
          python translate_apk.py

      - name: Clean Junk Files (Fix AAPT Error)
        run: |
          # Diệt tận gốc tất cả các file rác bắt đầu bằng ._ trong toàn bộ thư mục app
          find decompiled_app -name "._*" -type f -delete
          echo "Đã quét sạch toàn bộ file ẩn hệ thống gây lỗi build!"

      - name: Recompile & Sign
        run: |
          # Ép apktool build lại và làm mới hoàn toàn bản đồ tài nguyên resources.arsc
          apktool b -f decompiled_app -o unsigned.apk
          
          # Ký số đóng dấu thương hiệu độc quyền
          keytool -genkey -v -keystore Gialong.keystore -storepass gia123 -alias gialong -keypass gia123 -dname "CN=Huynh Gia Long, O=Gia Long Studio, C=VN" -keyalg RSA -keysize 2048 -validity 10000
          jarsigner -verbose -keystore Gialong.keystore -storepass gia123 -keypass gia123 unsigned.apk gialong
          mv unsigned.apk GiaLong_ReflectMaster_VN.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Final_APK_GiaLong
          path: GiaLong_ReflectMaster_VN.apk
          
